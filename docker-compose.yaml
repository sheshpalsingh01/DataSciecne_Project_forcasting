services:
  forecast:
    image: ${FORECAST_IMAGE:-sales-forecast:local}
    build: .
    ports:
      - "127.0.0.1:${FORECAST_PORT:-5000}:5000"
    volumes:
      - type: bind
        source: ${FORECAST_ARTIFACTS_DIR:-./artifacts}/data_transformation/preprocessor.joblib
        target: /app/artifacts/data_transformation/preprocessor.joblib
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FORECAST_ARTIFACTS_DIR:-./artifacts}/model_trainer/model.joblib
        target: /app/artifacts/model_trainer/model.joblib
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
